# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: lenos

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

snapshot:
  version_template: "0.0.0-{{ .Timestamp }}"

before:
  hooks:
    - go mod tidy
    - rm -rf completions
    - mkdir completions
    - rm -rf manpages
    - mkdir manpages
    - sh -c 'go run . completion bash >./completions/lenos.bash'
    - sh -c 'go run . completion zsh >./completions/lenos.zsh'
    - sh -c 'go run . completion fish >./completions/lenos.fish'
    - sh -c 'go run . man | gzip -c >./manpages/lenos.1.gz'

builds:
  - id: lenos
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=greenteagc
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/tta-lab/lenos/internal/version.Version={{.Version}}
  - id: lenos-installer
    main: ./cmd/lenos-installer
    binary: lenos-installer
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: lenos
    formats: [tar.gz]
    ids:
      - lenos
    name_template: >-
      lenos_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - completions/*
      - manpages/*
      - LICENSE*
      - README*
  - id: lenos-installer
    formats: [tar.gz]
    ids:
      - lenos-installer
    name_template: >-
      lenos-installer_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

release:
  extra_files:
    - glob: scripts/install.sh
      name_template: install.sh

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"

nfpms:
  - id: packages
    package_name: lenos
    file_name_template: "lenos_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: "https://github.com/tta-lab/lenos"
    maintainer: "tta-lab <team@tta-lab.com>"
    description: "A terminal-first AI assistant and interactive runtime for the ttal ecosystem"
    license: "FSL-1.1-MIT"
    formats:
      - deb
      - rpm
    contents:
      - src: ./completions/lenos.bash
        dst: /usr/share/bash-completion/completions/lenos
      - src: ./completions/lenos.zsh
        dst: /usr/share/zsh/site-functions/_lenos
      - src: ./completions/lenos.fish
        dst: /usr/share/fish/vendor_completions.d/lenos.fish
      - src: ./manpages/lenos.1.gz
        dst: /usr/share/man/man1/lenos.1.gz
